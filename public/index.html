<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>BIM Data Manager (SQLite)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <header>
      <h1>BIM Data Manager</h1>
      <div class="subtitle">SQLite + Express • inserimenti semplificati</div>
    </header>

    <main class="layout">
      <aside>
        <h2>Tabelle</h2>
        <ul id="tables"></ul>

        <div class="panel">
          <h3>🛠️ Strumenti</h3>
          <button id="btn-backup" class="btn-secondary">💾 Crea backup</button>
          <hr />
          <form id="csv-form">
            <label>Import CSV nella tabella corrente</label>
            <input type="file" id="csv-file" accept=".csv" />
            <button type="submit" id="csv-upload" class="btn-primary" disabled>📥 Importa CSV</button>
          </form>
          <small class="muted">Prima seleziona una tabella.</small>
        </div>

        <div class="panel">
          <h3>🔗 Legami Pset/Parametri</h3>
          <button id="btn-matrix" class="btn-secondary">Apri matrice Pset-Parametri</button>
        </div>
        <div class="panel">
          <h3>🧩 Legami Codice/Pset</h3>
          <button id="btn-codice-matrix" class="btn-secondary">Apri matrice Codice-Pset</button>
        </div>
      </aside>

      <section class="content">
        <div id="table-header">
          <h2 id="current-table">Seleziona una tabella</h2>
          <button id="refresh" class="btn-secondary" disabled>🔄 Ricarica</button>
        </div>

        <div class="toolbar">
          <input id="search" placeholder="Cerca (testo su colonne TEXT)..." />
          <select id="page-size">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
          </select>
          <button id="btn-apply-filter" class="btn-secondary">Applica filtro</button>
          <div class="pager">
            <button id="prev-page" class="btn-ghost btn-icon" disabled>&lt;</button>
            <span id="page-info">0–0 di 0</span>
            <button id="next-page" class="btn-ghost btn-icon" disabled>&gt;</button>
          </div>
        </div>

        <div id="form-area"></div>

        <div id="rows-area">
          <h3>Righe</h3>
          <div id="rows"></div>
        </div>
      </section>
    </main>

    <footer>
      <small>Local dev • DB in <code>/data/MODELLO_DATI.db</code></small>
    </footer>
  </body>
</html>
